paths:
  /api/login:
    post:
      summary: Login API
      tags:
        - Auth
      responses:
        '200':
          description: OK
      operationId: post-api-login
      description: ''
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                email:
                  type: string
                  x-stoplight:
                    id: 6xp6fqod2xx5j
                  example: user9@gmail.com
                password:
                  type: string
                  x-stoplight:
                    id: 5thy0s7usvfyv
                  example: user9123*
              required:
                - email
                - password
            examples:
              Example:
                value:
                  email: user9@gmail.com
                  password: user9123*
              Example 1:
                value:
                  email: string
                  password: string
        description: ''
  /api/logout:
